name: Deploy Frontend to EC2

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      ec2_host:
        description: "EC2 host IP"
        required: true
        default: "15.252.122.182"

env:
  EC2_HOST: ${{ github.event.inputs.ec2_host || secrets.EC2_HOST }}
  EC2_USER: ec2-user
  DEPLOY_DIR: /var/www/picvibz
  VITE_API_URL: ${{ secrets.VITE_API_URL }}
  VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
  VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------
      # Checkout
      # ---------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------
      # Setup pnpm
      # ---------------------------------------------
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      # ---------------------------------------------
      # Setup Node
      # ---------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      # ---------------------------------------------
      # Install dependencies
      # ---------------------------------------------
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ---------------------------------------------
      # Build Vite
      # ---------------------------------------------
      - name: Build Vite
        env:
          VITE_API_URL: ${{ env.VITE_API_URL }}
          VITE_SUPABASE_URL: ${{ env.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ env.VITE_SUPABASE_ANON_KEY }}
        run: pnpm build

      # ---------------------------------------------
      # Verify build
      # ---------------------------------------------
      - name: Verify build
        run: |
          if [ ! -d "dist" ]; then
            echo "Build failed"
            exit 1
          fi

          echo "Build successful"
          ls -lah dist

      # ---------------------------------------------
      # Setup SSH key
      # ---------------------------------------------
      - name: Setup SSH key
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          echo "$EC2_SSH_KEY" > /tmp/ec2-key
          chmod 600 /tmp/ec2-key

      # ---------------------------------------------
      # Test SSH
      # ---------------------------------------------
      - name: Test SSH connection
        run: |
          ssh \
            -i /tmp/ec2-key \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=10 \
            "${EC2_USER}@${EC2_HOST}" \
            "echo 'SSH connection successful'"

      # ---------------------------------------------
      # Install Nginx if not installed
      # ---------------------------------------------
      - name: Install Nginx
        run: |
          ssh \
            -i /tmp/ec2-key \
            -o StrictHostKeyChecking=no \
            "${EC2_USER}@${EC2_HOST}" \
            "command -v nginx >/dev/null 2>&1 || sudo dnf install nginx -y"

      # ---------------------------------------------
      # Create deployment directory
      # ---------------------------------------------
      - name: Prepare deployment directory
        run: |
          ssh \
            -i /tmp/ec2-key \
            -o StrictHostKeyChecking=no \
            "${EC2_USER}@${EC2_HOST}" \
            "sudo mkdir -p ${DEPLOY_DIR} && sudo chown -R ${EC2_USER}:${EC2_USER} ${DEPLOY_DIR}"

      # ---------------------------------------------
      # Remove old frontend
      # ---------------------------------------------
      - name: Remove old frontend
        run: |
          ssh \
            -i /tmp/ec2-key \
            -o StrictHostKeyChecking=no \
            "${EC2_USER}@${EC2_HOST}" \
            "rm -rf ${DEPLOY_DIR:?}/*"

      # ---------------------------------------------
      # Upload new frontend
      # ---------------------------------------------
      - name: Upload frontend
        run: |
          scp \
            -i /tmp/ec2-key \
            -o StrictHostKeyChecking=no \
            -r dist/* \
            "${EC2_USER}@${EC2_HOST}:${DEPLOY_DIR}/"

      # ---------------------------------------------
      # Fix permissions
      # ---------------------------------------------
      - name: Fix permissions
        run: |
          ssh \
            -i /tmp/ec2-key \
            -o StrictHostKeyChecking=no \
            "${EC2_USER}@${EC2_HOST}" \
            "sudo chmod -R 755 ${DEPLOY_DIR}"

      # ---------------------------------------------
      # Configure Nginx
      # ---------------------------------------------
      - name: Configure Nginx
        run: |
          ssh \
            -i /tmp/ec2-key \
            -o StrictHostKeyChecking=no \
            "${EC2_USER}@${EC2_HOST}" \
            "sudo tee /etc/nginx/conf.d/picvibz.conf > /dev/null <<'EOF'
          server {
              listen 80;
              server_name _;

              root /var/www/picvibz;
              index index.html;

              location / {
                  try_files \$uri \$uri/ /index.html;
              }
          }
          EOF"

      # ---------------------------------------------
      # Test Nginx configuration
      # ---------------------------------------------
      - name: Test Nginx
        run: |
          ssh \
            -i /tmp/ec2-key \
            -o StrictHostKeyChecking=no \
            "${EC2_USER}@${EC2_HOST}" \
            "sudo nginx -t"

      # ---------------------------------------------
      # Enable and restart Nginx
      # ---------------------------------------------
      - name: Start Nginx
        run: |
          ssh \
            -i /tmp/ec2-key \
            -o StrictHostKeyChecking=no \
            "${EC2_USER}@${EC2_HOST}" \
            "sudo systemctl enable nginx && sudo systemctl restart nginx"

      # ---------------------------------------------
      # Verify Nginx
      # ---------------------------------------------
      - name: Verify Nginx
        run: |
          ssh \
            -i /tmp/ec2-key \
            -o StrictHostKeyChecking=no \
            "${EC2_USER}@${EC2_HOST}" \
            "sudo systemctl is-active --quiet nginx"

          echo "Nginx is running"

      # ---------------------------------------------
      # Verify frontend
      # ---------------------------------------------
      - name: Verify deployment
        run: |
          echo "Checking frontend..."

          HTTP_CODE=$(curl \
            -s \
            -o /dev/null \
            -w "%{http_code}" \
            --max-time 10 \
            "http://${EC2_HOST}")

          echo "HTTP status: ${HTTP_CODE}"

          if [ "${HTTP_CODE}" -ge 200 ] && [ "${HTTP_CODE}" -lt 400 ]; then
            echo "================================="
            echo "Deployment successful!"
            echo "Frontend: http://${EC2_HOST}"
            echo "================================="
          else
            echo "Deployment health check failed"
            exit 1
          fi
